<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$if(pagetitle)$$pagetitle$ · $endif$$site$</title>
$if(description)$<meta name="description" content="$description$">
$endif$$if(highlighting-css)$<style>
$highlighting-css$
</style>
$endif$<script>document.documentElement.classList.add("js");try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="$base$/style.css">
<link rel="alternate" type="application/atom+xml" title="$site$" href="$base$/feed.xml">
</head>
<body>
<header class="site">
  <a class="brand" href="$base$/">$site$</a>
  <nav id="site-nav">
    <a href="$base$/blog/">Blog</a>
    <a href="$base$/tags/">Themen</a>
    <a href="$base$/gallery/">Galerie</a>
    <a href="$base$/slides/">Slides</a>
    <a href="$base$/about/">Über mich</a>
  </nav>
  <div class="actions">
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Hell/Dunkel umschalten">🌙</button>
    <button id="menu-toggle" class="icon-btn" type="button" aria-label="Menü" aria-expanded="false" aria-controls="site-nav">☰</button>
  </div>
</header>
<main>
$if(post)$<article>
<h1>$title$</h1>
<p class="meta"><time datetime="$date$">$date$</time>$for(tags)$ <a class="tag" href="$base$/tags/$tags$/">#$tags$</a>$endfor$</p>
$body$
</article>
$else$$if(title)$<h1>$title$</h1>
$endif$$body$
$endif$</main>
<footer class="site">
  <p>© $year$ $author$ · <a href="$base$/feed.xml">Feed</a></p>
</footer>
<script src="$base$/site.js" defer></script>
</body>
</html>
