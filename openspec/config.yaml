schema: spec-driven

context: |
  Language: de
  All artifacts must be written in de.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

# Workflow-Verdrahtung, siehe docs/workflow.md
rules:
  tasks:
    - Jede Task so schneiden, dass sie ein GitHub-Issue sein kann (ein Ergebnis, einzeln prüfbar), Eingabe für /to-tickets
operations:
  apply:
    guidance:
      - Umsetzung je GitHub-Ticket mit /implement (tdd, dann code-review), build.sh-Ausgabe zählt als Test
      - Pro Ticket ein Branch und PR, der das Issue und den Change-Namen referenziert
  archive:
    guidance:
      - Vor dem Archivieren code-review gegen die Delta-Specs laufen lassen
