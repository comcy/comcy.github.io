name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pandoc installieren
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: pandoc-Version
        run: pandoc --version | head -1
      - name: Tests
        run: sh tests/run.sh
