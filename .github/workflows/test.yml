name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pandoc
      - name: Tests
        run: sh tests/run.sh

  # Python-Werkzeug (workflow/, scripts/): auf allen drei Systemen, mit der Mindestversion
  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python-Tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Prozessdaten prüfen
        run: python scripts/flow.py validate

  # Dieselben Prüfungen wie die Git-Hooks, verbindlich für jeden PR (auch bei --no-verify)
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Commit-Lint
        run: python scripts/gate.py commits "origin/${{ github.base_ref }}..HEAD"
        if: github.event_name == 'pull_request'
      - name: Secret-Scan
        run: python scripts/gate.py secrets --range "origin/${{ github.base_ref }}..HEAD"
        if: github.event_name == 'pull_request'
