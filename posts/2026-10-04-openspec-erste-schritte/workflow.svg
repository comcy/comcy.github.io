<line x1="510" y1="526.0" x2="560" y2="526.0" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="560" y="486.0" width="340" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
<text x="574" y="510.0" font-size="12.5" fill="#7f1d1d"><tspan font-family="ui-monospace,Menlo,monospace" text-decoration="line-through" font-weight="700">/openspec-apply-change</tspan></text>
<text x="574" y="524.0" font-size="11.5" fill="#475569">-> ersetzt durch /implement</text>
<text x="574" y="544.0" font-size="12.5" fill="#7f1d1d"><tspan font-family="ui-monospace,Menlo,monospace" text-decoration="line-through" font-weight="700">openspec verify</tspan></text>
