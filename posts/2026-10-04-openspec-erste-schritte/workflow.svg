<text x="58" y="780" font-size="14" font-weight="700" fill="#92400e">Erweiterungspunkte (Gerüst, noch nicht ausgebaut)</text>
<text x="58" y="808" font-size="12.5" font-weight="700" fill="#78350f">UI/UX klären</text><text x="58" y="823" font-size="11.5" fill="#44403c">/prototype vor Phase 2, Ergebnis in design.md</text>
<text x="488" y="808" font-size="12.5" font-weight="700" fill="#78350f">Früher Tester</text><text x="488" y="823" font-size="11.5" fill="#44403c">Preview-Link am Issue, needs-info; evtl. Abnahme vor Phase 5</text>
<text x="58" y="842" font-size="12.5" font-weight="700" fill="#78350f">Rückfrage an PO</text><text x="58" y="857" font-size="11.5" fill="#44403c">Schleife 1 &lt;-&gt; 2: needs-info, dann /openspec-update-change</text>
<text x="488" y="842" font-size="12.5" font-weight="700" fill="#78350f">Bug ohne Verhaltensänderung</text><text x="488" y="857" font-size="11.5" fill="#44403c">kein Change: /diagnosing-bugs + /tdd + Issue</text>
<text x="58" y="876" font-size="12.5" font-weight="700" fill="#78350f">Sehr großes Vorhaben</text><text x="58" y="891" font-size="11.5" fill="#44403c">/wayfinder davor, danach je Entscheidung ein Change</text>
<text x="488" y="876" font-size="12.5" font-weight="700" fill="#78350f">Mehrere Personen</text><text x="488" y="891" font-size="11.5" fill="#44403c">/triage als Eingang, später Rollen, Review-Pflicht, Branch-Schutz</text>
