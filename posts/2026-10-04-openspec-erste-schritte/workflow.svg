<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 945" width="940" height="945" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="Entwicklungs-Workflow mit OpenSpec, Matt-Pocock-Skills und GitHub">
